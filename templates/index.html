<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lung Cancer Prediction</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url("https://tse2.mm.bing.net/th/id/OIP.J9-V6GoClSgpLFHC6BWSAgHaEK?rs=1&pid=ImgDetMain&o=7&rm=3")
                  no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }
    .overlay {
      background: rgba(0, 0, 0, 0.6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .form-box {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
    h1, h2 {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="form-box">
      <h1 class="mb-3">Lung Cancer Prediction</h1>
      <p class="text-center text-muted">Fill in your details below to check your risk.</p>

      <form method="POST" action="/predict">
        <div class="row">
          {% for feature in features %}
          <div class="col-md-6 mb-3">
            <label for="{{ feature }}" class="form-label">{{ feature.replace("_", " ").title() }}</label>
            <input type="number" class="form-control" id="{{ feature }}" name="{{ feature }}" required>
          </div>
          {% endfor %}
        </div>

        <div class="text-center mt-3">
          <button type="submit" class="btn btn-success btn-lg">Predict</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
